{% extends "admin/layout_admin.html" %}

{% block content %}

<h2 class="mb-4">予約編集</h2>

<div class="card p-4 shadow-sm">
<form method="POST"
      id="reservation-form"
      action="{{ url_for('admin.edit_reservation', resv_id=r.id) }}"
      data-reservation-id="{{ r.id }}"
      data-initial-menu="{{ r.menu }}"
      data-initial-duration="{{ r.duration }}"
      data-initial-time="{{ r.start_at.strftime('%H:%M') }}">

    <div class="mb-3">
        <label class="form-label">お名前</label>
        <input type="text" name="customer_name"
               value="{{ r.customer_name }}"
               class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">電話番号</label>
        <input type="text" name="phone"
               value="{{ r.phone }}"
               class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">メニュー</label>
        <select name="menu" id="menu" class="form-select" required>
            <option value="training">パーソナルトレーニング</option>
            <option value="massage">マッサージ</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">時間</label>
        <select name="duration" id="duration" class="form-select" required>
            <!-- JSで生成 -->
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">予約日</label>
        <input type="date" name="date"
               value="{{ date }}"
               class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">開始時間（10分単位）</label>
        <select name="time" id="time" class="form-select" required>
            {% for h in range(9, 22) %}
                {% for m in [0,10,20,30,40,50] %}
                <option value="{{ '%02d:%02d' % (h, m) }}">
                    {{ '%02d:%02d' % (h, m) }}
                </option>
                {% endfor %}
            {% endfor %}
            <option value="22:00">22:00</option>
        </select>
    </div>

    <button class="btn btn-primary w-100">更新する</button>
</form>
</div>

<a href="{{ url_for('admin.admin_dashboard') }}"
   class="btn btn-secondary mt-3">戻る</a>

<script src="{{ url_for('static', filename='js/reservation_form.js') }}"></script>

{% endblock %}
